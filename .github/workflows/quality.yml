---
name: Operator-managed quality checks
on:
  workflow_dispatch:
jobs:
  quality:
    # No dependency installation or secrets transfer to a hosted runner.
    # Configure this label only on a trusted, pre-provisioned runner.
    runs-on: [self-hosted, linux, assistant-team-quality]
    permissions:
      contents: read
    steps:
      - name: Check out source without retaining a Git credential
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run the existing provisioned quality environment
        run: python3.12 src/check-quality.py
