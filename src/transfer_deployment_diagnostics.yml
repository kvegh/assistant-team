---
- name: Load operator-owned connection for sanitized diagnostic transfer
  hosts: localhost
  gather_facts: false
  no_log: true
  tasks:
    - name: Load the encrypted deployment definition
      ansible.builtin.include_vars:
        file: "{{ assistant_destination_vault }}"
        name: destination
    - name: Register the destination in transient inventory
      ansible.builtin.add_host:
        name: assistant_destination
        groups: assistant_destinations
        ansible_host: "{{ destination.connection.host }}"
        ansible_user: "{{ destination.connection.user }}"
        ansible_connection: "{{ assistant_local | default(false) | bool | ternary('local', 'ssh') }}"
        ansible_port: "{{ destination.connection.port | default(22) }}"
        ansible_password: "{{ destination.connection.password | default(omit) }}"
        ansible_become_password: "{{ destination.connection.become_password | default(omit) }}"
- name: Persist safe deployment metadata in primary target environment diagnostics
  hosts: assistant_destinations
  become: true
  gather_facts: false
  no_log: true
  vars:
    containers:
      runtime_user: "{{ hostvars.localhost.destination.runtime_user }}"
    assistant_install_prefix: "{{ hostvars.localhost.destination.install_prefix | default('') }}"
  tasks:
    - name: Resolve canonical diagnostic installation paths
      ansible.builtin.include_role:
        name: install_layout
    - name: Resolve the runtime account
      ansible.builtin.getent:
        database: passwd
        key: "{{ hostvars.localhost.destination.runtime_user }}"
    - name: Define protected runtime paths
      ansible.builtin.set_fact:
        diagnostic_home: "{{ assistant_install_root }}"
    - name: Prepare protected runtime paths
      ansible.builtin.file:
        path: "{{ diagnostic_home }}/environment-logs"
        state: directory
        owner: "{{ hostvars.localhost.destination.runtime_user }}"
        mode: "0700"
    - name: Install protected deployment content
      ansible.builtin.copy:
        src: "{{ assistant_safe_deployment_metadata }}"
        dest: "{{ diagnostic_home }}/environment-logs/deployment-{{ assistant_deployment_run_id }}.jsonl"
        owner: "{{ hostvars.localhost.destination.runtime_user }}"
        mode: "0600"
    - name: Provide human-readable deployment metadata beside its JSON counterpart
      ansible.builtin.copy:
        dest: "{{ diagnostic_home }}/environment-logs/deployment-{{ assistant_deployment_run_id }}.log"
        content: |
          {% for line in lookup('file', assistant_safe_deployment_metadata).splitlines() %}
          {% set event = line | from_json %}
          {{ event.timestamp }} | deployment | {{ event.result }} | exit {{ event.exit_code }}
          {% if event.module is defined %}Module: {{ event.module }}
          {% endif %}Event: {{ event.correlation_id }}
          {% endfor %}
        owner: "{{ hostvars.localhost.destination.runtime_user }}"
        mode: "0600"
    - name: Inspect regular deployment metadata files without following links
      ansible.builtin.find:
        paths: "{{ diagnostic_home }}/environment-logs"
        patterns: "^deployment-[a-f0-9]{32}\\.(jsonl|log)$"
        use_regex: true
        file_type: file
        follow: false
      register: diagnostic_retained_files
    - name: Bound retained deployment metadata using Ansible file state
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
        follow: false
      loop: "{{ (diagnostic_retained_files.files | sort(attribute='mtime'))[:-64] }}"
