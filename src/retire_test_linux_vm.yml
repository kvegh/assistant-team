---
- name: Load the isolated encrypted retirement definition
  hosts: localhost
  gather_facts: false
  no_log: true
  pre_tasks:
    - name: Read the explicitly selected test clone definition
      ansible.builtin.include_role:
        name: secret_config
        apply:
          tags: [always]
      vars:
        secret_config_name: retire_test
        secret_config_namespace: retired_definition
      tags: [always]

- name: Safely retire only the selected disposable Linux test clone
  hosts: hypervisor
  gather_facts: false
  become: true
  no_log: true
  vars:
    linux_vm_retire_definition: "{{ hostvars.localhost.retired_definition.provisioning }}"
    linux_vm_retire_disk: "{{ linux_vm_retire_definition.vm_dir }}/{{ linux_vm_retire_definition.vm_name }}.disk.qcow2"
    linux_vm_retire_execute: "{{ retire_test_execute | default(false) | bool }}"
  roles:
    - linux_vm_retire
