---
- name: Resolve the requested disposable VM from live AAP inventory
  hosts: localhost
  gather_facts: false
  no_log: true
  pre_tasks:
    - name: Require a separate execution inventory before retiring a managed VM
      ansible.builtin.assert:
        that:
          - awx_inventory_id | default('') | string is match('^[1-9][0-9]*$')
          - lookup('ansible.builtin.env', 'AC_AGENTS_CONTROLLER_INVENTORY_ID') is match('^[1-9][0-9]*$')
          - awx_inventory_id | int != lookup('ansible.builtin.env', 'AC_AGENTS_CONTROLLER_INVENTORY_ID') | int
        fail_msg: >-
          Run retirement from the hypervisor execution inventory, separate from the
          managed VM inventory. Controller cannot delete a host from an inventory
          while this job is using that inventory.
        quiet: true
      when: awx_job_id is defined
      tags: [always]
    - name: Load shared encrypted infrastructure configuration
      ansible.builtin.include_role:
        name: secret_config
        apply:
          tags: [always]
      tags: [always]
      vars:
        secret_config_name: retire_test
        secret_config_namespace: retirement_infrastructure
    - name: Validate inventory authority and production protection
      ansible.builtin.include_role:
        name: inventory_vm_guard
      vars:
        inventory_vm_guard_name: "{{ teardown_vm_name | default('') }}"
        inventory_vm_guard_operation: retire
        inventory_vm_guard_allow_absent: >-
          {{ retirement_infrastructure.provisioning.generic_image | default(false) | bool
             and retirement_infrastructure.provisioning.hypervisor_pin is defined }}

- name: Safely retire only the inventory-selected disposable Linux VM
  hosts: hypervisor
  gather_facts: false
  become: true
  no_log: true
  vars:
    linux_vm_retire_definition: >-
      {{ hostvars.localhost.retirement_infrastructure.provisioning | combine({'vm_name': teardown_vm_name}) }}
    linux_vm_retire_disk: "{{ linux_vm_retire_definition.vm_dir }}/{{ linux_vm_retire_definition.vm_name }}.disk.qcow2"
    linux_vm_retire_execute: "{{ retire_test_execute | default(false) | bool }}"
  pre_tasks:
    - name: Plan exact generic retirement from saved canonical ownership before deleting anything
      ansible.builtin.include_role:
        name: linux_recovery_release
      vars:
        linux_recovery_release_operation: retire_guest
        linux_recovery_release_retire_phase: plan
        linux_recovery_release_retire_guest_name: "{{ linux_vm_retire_definition.vm_name }}"
        linux_recovery_release_retire_hypervisor: "{{ linux_vm_retire_definition.hypervisor_pin }}"
      when:
        - linux_vm_retire_definition.generic_image | default(false) | bool
        - linux_vm_retire_definition.hypervisor_pin is defined
  roles:
    - linux_vm_retire
