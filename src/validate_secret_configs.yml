---
- name: Validate the five encrypted configuration inputs without contacting target hosts
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Load each encrypted input in a private namespace
      ansible.builtin.include_role:
        name: secret_config
      vars:
        secret_config_name: "{{ item }}"
        secret_config_namespace: _assistant_validated_config
      loop: [environment, fresh_test, retire_test, claude_auth_recovery, codex_auth_recovery]
    - name: Confirm the final decrypted input is a configuration mapping
      ansible.builtin.assert:
        that:
          - _assistant_validated_config is mapping
          - _assistant_validated_config | length > 0
      no_log: true
