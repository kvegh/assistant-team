---
- name: Load the isolated encrypted deployment definition
  hosts: localhost
  gather_facts: false
  no_log: true
  tags: [always]
  pre_tasks:
    - name: Load the encrypted deployment definition
      ansible.builtin.include_role:
        name: secret_config
        apply:
          tags: [always]
      vars:
        secret_config_name: fresh_test
        secret_config_namespace: fresh_definition
        secret_config_file: "{{ assistant_vm_configuration | default('') }}"
      tags: [always]
    - name: Constrain explicit HTTP approval to this encrypted generic guest definition
      ansible.builtin.assert:
        that:
          - fresh_definition.container_build_http_bootstrap | default(false) is boolean
          - >-
            not (fresh_definition.container_build_http_bootstrap | default(false)) or
            (fresh_definition.provisioning.generic_image | default(false) is sameas true
             and fresh_definition.provisioning.hypervisor_pin | default({}) | length > 0)
          - >-
            not (fresh_definition.container_build_http_bootstrap | default(false)) or
            (deployment_vm_name | default(fresh_definition.provisioning.vm_name, true)
             == fresh_definition.provisioning.vm_name)
        fail_msg: HTTP approval applies only to the exact selected encrypted generic guest and its reviewed pin.
        quiet: true
      tags: [always]
    - name: Resolve the explicit target against the authoritative inventory
      when: "'repair_inventory_registration' not in ansible_run_tags"
      ansible.builtin.include_role:
        name: deployment_target
        apply:
          tags: [always]
      tags: [always]
    - name: Publish the resolved deployment definition for the remaining plays
      when: "'repair_inventory_registration' not in ansible_run_tags"
      ansible.builtin.set_fact:
        fresh_definition: "{{ deployment_target_definition }}"
      tags: [always]

- name: Complete only an interrupted inventory group association
  hosts: hypervisor
  gather_facts: false
  become: true
  no_log: true
  tags: [never, repair_inventory_registration]
  vars:
    provisioning: "{{ hostvars.localhost.fresh_definition.provisioning }}"
    hactar_source_git_token: "{{ hostvars.localhost.fresh_definition.hactar_source_git_token }}"
  tasks:
    - name: Repair only the verified ungrouped generic guest registration
      ansible.builtin.include_role:
        name: deployment_inventory_registration
        tasks_from: repair
        apply:
          tags: [repair_inventory_registration]
      when: "'repair_inventory_registration' in ansible_run_tags"
    - name: End the association-only repair invocation
      ansible.builtin.meta: end_play

- name: Provision the isolated fresh Linux VM
  hosts: hypervisor
  gather_facts: false
  become: true
  no_log: true
  tags: [provision]
  vars:
    provisioning: "{{ hostvars.localhost.fresh_definition.provisioning }}"
    hactar_source_git_token: "{{ hostvars.localhost.fresh_definition.hactar_source_git_token }}"
    linux_vm_deployment_name: "{{ hostvars.localhost.__deployment_target_name }}"
  pre_tasks:
    - name: End association-only repair before provisioning role argument validation
      ansible.builtin.meta: end_play
      when: "'repair_inventory_registration' in ansible_run_tags"
      tags: [always]
  roles:
    - linux_vm

- name: Persist the newly discovered guest in the authoritative inventory
  hosts: localhost
  gather_facts: false
  no_log: true
  tags: [provision, offline_recovery]
  pre_tasks:
    - name: End association-only repair before normal inventory registration
      ansible.builtin.meta: end_play
      when: "'repair_inventory_registration' in ansible_run_tags"
      tags: [always]
  roles:
    - deployment_inventory_registration

- name: Update and install the complete native environment
  hosts: provisioned_linux_guest
  gather_facts: false
  become: true
  no_log: true
  tags: [guest_config]
  vars:
    provisioning: "{{ hostvars.localhost.fresh_definition.provisioning }}"
    hactar_source_git_token: "{{ hostvars.localhost.fresh_definition.hactar_source_git_token }}"
    assistant_install_prefix: "{{ hostvars.localhost.fresh_definition.install_prefix | default('') }}"
    containers:
      runtime_user: "{{ hostvars.localhost.fresh_definition.runtime_user }}"
    project_framework_enabled_profiles: "{{ hostvars.localhost.fresh_definition.enabled_profiles | default([]) }}"
    assistant_source_user: "{{ containers.runtime_user }}"
    vertex_auth_install_sdk: "{{ hostvars.localhost.fresh_definition.install_google_cloud_sdk | default(false) }}"
  pre_tasks:
    - name: End association-only repair before guest configuration role validation
      ansible.builtin.meta: end_play
      when: "'repair_inventory_registration' in ansible_run_tags"
      tags: [always]
    - name: Verify the authenticated guest before requesting bootstrap access
      ansible.builtin.include_role:
        name: linux_guest
    - name: Verify the requested root capacity before requesting bootstrap access
      ansible.builtin.include_role:
        name: linux_root_growth
    - name: Validate explicit HTTP bootstrap approval in the selected encrypted profile
      ansible.builtin.assert:
        that:
          - hostvars.localhost.fresh_definition.container_build_http_bootstrap | default(false) is boolean
          - >-
            not (hostvars.localhost.fresh_definition.container_build_http_bootstrap | default(false)) or
            (provisioning.generic_image | default(false) | bool
             and deployment_vm_hypervisor_pin | default({}) | length > 0)
        fail_msg: HTTP bootstrap requires an explicit boolean in the selected pinned generic test profile.
        quiet: true
    - name: Grant only approved public HTTPS bootstrap for the verified pinned generic guest
      ansible.builtin.import_tasks: tasks/verified_generic_guest.yml
      vars:
        linux_recovery_release_operation: guest_bootstrap_https
      when:
        - provisioning.generic_image | default(false) | bool
        - deployment_vm_hypervisor_pin | default({}) | length > 0
    - name: Grant approved public HTTP bootstrap only for the selected verified test profile
      ansible.builtin.import_tasks: tasks/verified_generic_guest.yml
      vars:
        linux_recovery_release_operation: guest_bootstrap_http
      when:
        - hostvars.localhost.fresh_definition.container_build_http_bootstrap | default(false) is sameas true
        - provisioning.generic_image | default(false) | bool
        - deployment_vm_hypervisor_pin | default({}) | length > 0
  roles:
    - linux_updates
    - podman_host
    - codex_sandbox
    - agent_images
    - agents_connector
    - native_auth
    - antigravity_team
    - project_framework
    - project_workspace
    - vertex_auth
    - role: native_auth_vault_restore
      tags: [auth_restore]
    - role: environment_validation
      environment_validation_run_projects: "{{ hostvars.localhost.fresh_definition.validate_projects | default(true) | bool }}"
      environment_validation_expected_disk_gb: "{{ hostvars.localhost.fresh_definition.provisioning.vm_disk_gb }}"
  tasks:
    - name: Release only the pinned generic guest after complete installation succeeds
      ansible.builtin.import_tasks: tasks/verified_generic_guest.yml
      when:
        - provisioning.generic_image | default(false) | bool
        - deployment_vm_hypervisor_pin | default({}) | length > 0
