---
- name: Load the isolated encrypted deployment definition
  hosts: localhost
  gather_facts: false
  no_log: true
  tags: [always]
  pre_tasks:
    - name: Load the encrypted deployment definition
      ansible.builtin.include_role:
        name: secret_config
        apply:
          tags: [always]
      vars:
        secret_config_name: fresh_test
        secret_config_namespace: fresh_definition
        secret_config_file: "{{ assistant_vm_configuration | default('') }}"
      tags: [always]
    - name: Resolve the explicit target against the authoritative inventory
      ansible.builtin.include_role:
        name: deployment_target
        apply:
          tags: [always]
      tags: [always]
    - name: Publish the resolved deployment definition for the remaining plays
      ansible.builtin.set_fact:
        fresh_definition: "{{ deployment_target_definition }}"
      tags: [always]

- name: Provision the isolated fresh Linux VM
  hosts: hypervisor
  gather_facts: false
  become: true
  no_log: true
  tags: [provision]
  vars:
    provisioning: "{{ hostvars.localhost.fresh_definition.provisioning }}"
    linux_vm_deployment_name: "{{ hostvars.localhost.__deployment_target_name }}"
  roles:
    - linux_vm

- name: Persist the newly discovered guest in the authoritative inventory
  hosts: localhost
  gather_facts: false
  no_log: true
  tags: [provision, offline_recovery]
  roles:
    - deployment_inventory_registration

- name: Update and install the complete native environment
  hosts: provisioned_linux_guest
  gather_facts: false
  become: true
  no_log: true
  tags: [guest_config]
  vars:
    provisioning: "{{ hostvars.localhost.fresh_definition.provisioning }}"
    assistant_install_prefix: "{{ hostvars.localhost.fresh_definition.install_prefix | default('') }}"
    containers:
      runtime_user: "{{ hostvars.localhost.fresh_definition.runtime_user }}"
    project_framework_enabled_profiles: "{{ hostvars.localhost.fresh_definition.enabled_profiles | default([]) }}"
    assistant_source_user: "{{ containers.runtime_user }}"
    vertex_auth_install_sdk: "{{ hostvars.localhost.fresh_definition.install_google_cloud_sdk | default(false) }}"
  roles:
    - linux_guest
    - linux_root_growth
    - linux_updates
    - podman_host
    - codex_sandbox
    - agent_images
    - agents_connector
    - native_auth
    - antigravity_team
    - project_framework
    - project_workspace
    - vertex_auth
    - role: native_auth_vault_restore
      tags: [auth_restore]
    - role: environment_validation
      environment_validation_run_projects: "{{ hostvars.localhost.fresh_definition.validate_projects | default(true) | bool }}"
      environment_validation_expected_disk_gb: "{{ hostvars.localhost.fresh_definition.provisioning.vm_disk_gb }}"
