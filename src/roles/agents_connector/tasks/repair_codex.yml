---
- name: Validate the explicitly selected repair project name
  ansible.builtin.assert:
    that:
      - agents_connector_repair_codex_project is match('^[a-z0-9][a-z0-9_-]{0,39}$')
    quiet: true
- name: Install the guarded Codex repair and current lifecycle implementation
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ __agents_connector_root }}/routing/{{ item }}"
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0700"
  loop: [connector-team.py, repair-codex.py]
- name: Repair the selected dead builder or restore its verified live-session marker
  become: true
  become_user: "{{ containers.runtime_user }}"
  environment:
    HOME: "{{ agents_connector_runtime_home }}"
    XDG_RUNTIME_DIR: "/run/user/{{ agents_connector_runtime_uid }}"
    ASSISTANT_PROJECT: "{{ agents_connector_repair_codex_project }}"
  ansible.builtin.command:
    argv: "{{ ['python3', __agents_connector_root + '/routing/repair-codex.py']
      + (['--restore-marker'] if agents_connector_repair_codex_restore_marker_only else []) }}"
  changed_when: true
