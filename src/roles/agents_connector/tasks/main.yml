---
- name: Inspect dedicated account for focused configuration reruns
  tags: [connector_services, auth_sources, connector_images, connector_codex_repair, connector_prompt_template, connector_ipc, connector_mcp_results]
  ansible.builtin.getent:
    database: passwd
    key: "{{ containers.runtime_user }}"
- name: Resolve dedicated home and user manager
  tags: [connector_services, auth_sources, connector_images, connector_codex_repair, connector_prompt_template, connector_ipc, connector_mcp_results]
  ansible.builtin.set_fact:
    agents_connector_runtime_home: "{{ ansible_facts.getent_passwd[containers.runtime_user][4] }}"
    agents_connector_runtime_uid: "{{ ansible_facts.getent_passwd[containers.runtime_user][1] }}"
- name: Define protected connector root
  tags: [connector_services, auth_sources, connector_images, connector_codex_repair, connector_prompt_template, connector_ipc, connector_mcp_results]
  ansible.builtin.set_fact:
    __agents_connector_root: "{{ agents_connector_runtime_home }}/agents-connector"
- name: Create connector directories in the dedicated home
  ansible.builtin.file:
    path: "{{ __agents_connector_root }}/{{ item }}"
    state: directory
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0700"
  loop: [bin, routing, state, profiles, build, dist]
- name: Download checksum-pinned upstream binary distribution
  ansible.builtin.get_url:
    url: "https://github.com/Aldenysq/agents-connector/releases/download/v{{ agents_connector_version }}/agents-connector-x86_64-unknown-linux-gnu.tar.xz"
    dest: "{{ __agents_connector_root }}/dist/release.tar.xz"
    checksum: "sha256:{{ agents_connector_sha256 }}"
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0600"
- name: Extract upstream binary and license
  ansible.builtin.unarchive:
    src: "{{ __agents_connector_root }}/dist/release.tar.xz"
    dest: "{{ __agents_connector_root }}/dist"
    remote_src: true
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
- name: Install upstream binary within the dedicated home
  ansible.builtin.copy:
    src: "{{ __agents_connector_root }}/dist/agents-connector-x86_64-unknown-linux-gnu/agents-connector"
    dest: "{{ __agents_connector_root }}/bin/agents-connector"
    remote_src: true
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0755"
- name: Install Gemini stock MCP result compatibility adapter
  tags: [connector_mcp_results]
  ansible.builtin.copy:
    src: mcp-results.py
    dest: "{{ __agents_connector_root }}/bin/mcp-results.py"
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0700"
    setype: container_file_t
    selevel: s0
- name: Verify the upstream executable
  become: true
  become_user: "{{ containers.runtime_user }}"
  ansible.builtin.command:
    argv: ["{{ __agents_connector_root }}/bin/agents-connector", --version]
  changed_when: false
- name: Install shared project name and socket path validator
  ansible.builtin.copy:
    src: "{{ role_path }}/../../lib/project-names.py"
    dest: "{{ __agents_connector_root }}/routing/project-names.py"
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0600"
- name: Install constrained lifecycle and IPC routing utility
  tags: [connector_services, auth_sources, connector_images, connector_codex_repair, connector_prompt_template, connector_ipc, connector_mcp_results]
  ansible.builtin.copy:
    src: connector-team.py
    dest: "{{ __agents_connector_root }}/routing/connector-team.py"
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0700"
  register: __agents_connector_utility

- name: Route broker wake commands through the constrained tmux adapter
  ansible.builtin.file:
    src: "{{ __agents_connector_root }}/routing/connector-team.py"
    dest: "{{ __agents_connector_root }}/routing/tmux"
    state: link
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
- name: Prepare individual profile directories
  ansible.builtin.file:
    path: "{{ __agents_connector_root }}/profiles/{{ item.0.name }}/{{ item.1 }}"
    state: directory
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0700"
  loop: "{{ agents_connector_profiles | product(['home', 'workspace', 'ipc', 'reports']) | list }}"
- name: Write generic profile specifications
  tags: [auth_sources]
  ansible.builtin.copy:
    dest: "{{ __agents_connector_root }}/profiles/{{ item.name }}/profile.json"
    content: "{{ item | to_nice_json }}\n"
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0600"
  loop: "{{ agents_connector_profiles }}"
- name: Copy rough role prompts
  ansible.builtin.template:
    src: role_instruction.md.j2
    dest: >-
      {{ __agents_connector_root }}/profiles/{{ item.name }}/workspace/{{
      {'claude': 'CLAUDE.md', 'codex': 'AGENTS.md', 'gemini': 'GEMINI.md'}[item.flavour] }}
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0600"
  loop: "{{ agents_connector_profiles }}"
- name: Safely migrate the editable default template
  tags: [auth_sources, connector_services, connector_prompt_template]
  ansible.builtin.import_tasks: prompt_template.yml
- name: Seed the single editable prompt file without overwriting operator edits
  tags: [auth_sources, connector_services, connector_prompt_template]
  ansible.builtin.copy:
    dest: "{{ agents_connector_runtime_home }}/templates/assistant-prompts.md"
    content: |
      # Edit the body under each [Role: Name] section; # lines are comments.
      # Examples below are inactive. Write instructions below them or remove '# Example:'.
      # Working containers receive only their own active section.

      {% for role in agents_connector_profiles %}
      [Role: {{ role.name | replace('-', ' ') | title }}]

      {{ lookup('ansible.builtin.file', role_path + '/prompts/' + role.name + '.md') }}

      {% endfor %}
    force: false
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0600"
- name: Provide the simple home-local team command
  tags: [auth_sources, connector_services]
  ansible.builtin.file:
    src: "{{ __agents_connector_root }}/routing/connector-team.py"
    dest: "{{ agents_connector_runtime_home }}/team"
    state: link
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
- name: Copy the tmux image extension context
  tags: [connector_images]
  ansible.builtin.copy:
    src: Containerfile
    dest: "{{ __agents_connector_root }}/build/Containerfile"
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0600"
- name: Validate selected native image flavours
  tags: [connector_images]
  ansible.builtin.assert:
    that:
      - agents_connector_image_flavours | length > 0
      - agents_connector_image_flavours | difference(['claude', 'codex', 'gemini']) | length == 0
    quiet: true
- name: Transfer and extend selected native images sequentially
  tags: [connector_images]
  when: connector_image.flavour in agents_connector_image_flavours
  ansible.builtin.include_tasks:
    file: image.yml
    apply:
      tags: [connector_images]
  loop:
    - { flavour: claude, version: "2.1.292" }
    - { flavour: codex, version: "0.160.1" }
    - { flavour: gemini, version: "0.63.0" }
  loop_control:
    loop_var: connector_image
- name: Create dedicated user service directory
  ansible.builtin.file:
    path: "{{ agents_connector_runtime_home }}/.config/systemd/user"
    state: directory
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0700"
- name: Publish the complete home-local usage guide
  tags: [auth_sources, connector_services]
  ansible.builtin.template:
    src: README.md.j2
    dest: "{{ agents_connector_runtime_home }}/README.md"
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0600"

- name: Repair only an explicitly selected failed Codex builder
  tags: [connector_codex_repair, connector_prompt_template]
  when: agents_connector_repair_codex_project | length > 0
  ansible.builtin.include_tasks:
    file: repair_codex.yml
    apply:
      tags: [connector_codex_repair, connector_prompt_template]

- name: Configure compatibility only for an explicitly selected Gemini project role
  tags: [connector_mcp_results]
  ansible.builtin.include_tasks:
    file: repair_gemini_mcp.yml
    apply:
      tags: [connector_mcp_results]
  when: agents_connector_repair_gemini_project | length > 0
