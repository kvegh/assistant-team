---
- name: Inspect canonical editable-template paths without following links
  ansible.builtin.stat:
    path: "{{ assistant_install_root }}/{{ item }}"
    follow: false
  loop: [conf, conf/templates, conf/templates/assistant.prompt.md.template]
  register: __agents_connector_template_paths
- name: Require ordinary template directories
  ansible.builtin.assert:
    that:
      - not (item.stat.islnk | default(false))
      - not item.stat.exists or item.stat.isdir | default(false)
    quiet: true
    fail_msg: Canonical template directories must not traverse links; no existing content was overwritten.
  loop: "{{ __agents_connector_template_paths.results[:2] }}"
- name: Require a regular canonical editable template
  ansible.builtin.assert:
    that:
      - not (__agents_connector_template_paths.results[2].stat.islnk | default(false))
      - not __agents_connector_template_paths.results[2].stat.exists or __agents_connector_template_paths.results[2].stat.isreg | default(false)
    quiet: true
    fail_msg: Canonical template must be a regular file; no existing content was overwritten.
- name: Prepare protected canonical editable-template directories
  ansible.builtin.file:
    path: "{{ assistant_install_root }}/{{ item }}"
    state: directory
    follow: false
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0700"
  loop: [conf, conf/templates]
- name: Keep existing canonical template private without rewriting it
  ansible.builtin.file:
    path: "{{ assistant_install_root }}/conf/templates/assistant.prompt.md.template"
    state: file
    follow: false
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0600"
  when: __agents_connector_template_paths.results[2].stat.exists
