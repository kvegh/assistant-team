---
- name: Inspect template directory and legacy source without following links
  ansible.builtin.stat:
    path: "{{ agents_connector_runtime_home }}/{{ item }}"
    follow: false
  loop: [templates, assistant-prompts.md, templates/assistant-prompts.md]
  register: __agents_connector_template_paths
- name: Require ordinary template paths and an unambiguous migration
  ansible.builtin.assert:
    that:
      - not (__agents_connector_template_paths.results[0].stat.islnk | default(false))
      - not __agents_connector_template_paths.results[0].stat.exists or __agents_connector_template_paths.results[0].stat.isdir | default(false)
      - not (__agents_connector_template_paths.results[1].stat.islnk | default(false))
      - not __agents_connector_template_paths.results[1].stat.exists or __agents_connector_template_paths.results[1].stat.isreg | default(false)
      - not (__agents_connector_template_paths.results[2].stat.islnk | default(false))
      - not __agents_connector_template_paths.results[2].stat.exists or __agents_connector_template_paths.results[2].stat.isreg | default(false)
      - not (__agents_connector_template_paths.results[1].stat.exists and __agents_connector_template_paths.results[2].stat.exists)
    quiet: true
    fail_msg: Template paths are unsafe or both template locations exist; resolve the conflict without overwriting either file.
- name: Create protected editable-template directory
  ansible.builtin.file:
    path: "{{ agents_connector_runtime_home }}/templates"
    state: directory
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0700"
- name: Preserve legacy operator template at its canonical location
  when: __agents_connector_template_paths.results[1].stat.exists
  block:
    - name: Atomically copy operator template without overwriting a destination
      ansible.builtin.copy:
        src: "{{ agents_connector_runtime_home }}/assistant-prompts.md"
        dest: "{{ agents_connector_runtime_home }}/templates/assistant-prompts.md"
        remote_src: true
        force: false
        owner: "{{ containers.runtime_user }}"
        group: "{{ containers.runtime_user }}"
        mode: "0600"
    - name: Verify migrated template bytes before removing the legacy file
      ansible.builtin.stat:
        path: "{{ agents_connector_runtime_home }}/templates/assistant-prompts.md"
        follow: false
      register: __agents_connector_migrated_template
    - name: Require a complete unchanged template copy
      ansible.builtin.assert:
        that:
          - __agents_connector_migrated_template.stat.checksum == __agents_connector_template_paths.results[1].stat.checksum
        quiet: true
    - name: Remove verified legacy template after migration
      ansible.builtin.file:
        path: "{{ agents_connector_runtime_home }}/assistant-prompts.md"
        state: absent
