---
argument_specs:
  main:
    short_description: Install the pinned stock broker, restricted routing and native tmux image extensions.
    options:
      containers:
        type: dict
        required: true
        description: Shared encrypted definition; role-specific required fields are documented and checked by the role.
      assistant_source_user:
        type: str
        required: true
      agents_connector_image_flavours:
        type: list
        elements: str
        default: [claude, codex, gemini]
        description: Native image subset to build; active containers are preserved.
      agents_connector_image_force:
        type: bool
        default: false
        description: Rebuild selected images even when their version tags already exist.
      agents_connector_repair_codex_project:
        type: str
        default: ''
        description: Explicit project whose failed Codex builder alone may be replaced and launched.
      agents_connector_repair_codex_restore_marker_only:
        type: bool
        default: false
        description: Restore launch bookkeeping only after verifying a live native Codex pane; never replace or restart it.
      agents_connector_repair_gemini_project:
        type: str
        default: ''
        description: Explicit existing project whose Gemini MCP command alone may be repaired.
      agents_connector_repair_gemini_role:
        type: str
        default: challenger
        description: Existing Gemini collaboration role; native sessions and all other settings remain unchanged.
