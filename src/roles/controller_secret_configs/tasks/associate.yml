---
- name: Inspect the selected job template credentials
  ansible.builtin.uri:
    ca_path: "{{ controller_secret_configs_ca_path or omit }}"
    url: >-
      {{ controller_secret_configs_host | regex_replace('/$', '') }}/api/controller/v2/job_templates/{{ controller_secret_configs_job_template }}/credentials/
    headers: {Authorization: "Bearer {{ controller_secret_configs_token }}"}
    return_content: true
  register: __controller_secret_configs_associations
  no_log: true
- name: Attach the snapshot without removing other credentials
  ansible.builtin.uri:
    ca_path: "{{ controller_secret_configs_ca_path or omit }}"
    url: >-
      {{ controller_secret_configs_host | regex_replace('/$', '') }}/api/controller/v2/job_templates/{{ controller_secret_configs_job_template }}/credentials/
    method: POST
    headers: {Authorization: "Bearer {{ controller_secret_configs_token }}"}
    body_format: json
    body: "{{ {'id': __controller_secret_configs_credential_id | int} | to_json }}"
    status_code: [200, 201, 204]
  when: __controller_secret_configs_credential_id | int not in __controller_secret_configs_associations.json.results | map(attribute='id') | list
  changed_when: true
  no_log: true
- name: Detach only the previous owned snapshot after the replacement is attached
  ansible.builtin.uri:
    ca_path: "{{ controller_secret_configs_ca_path or omit }}"
    url: >-
      {{ controller_secret_configs_host | regex_replace('/$', '') }}/api/controller/v2/job_templates/{{ controller_secret_configs_job_template }}/credentials/
    method: POST
    headers: {Authorization: "Bearer {{ controller_secret_configs_token }}"}
    body_format: json
    body: "{{ {'id': __controller_secret_configs_previous.json.results[0].id | int, 'disassociate': true} | to_json }}"
    status_code: [200, 201, 204]
  when:
    - __controller_secret_configs_previous.json is defined
    - __controller_secret_configs_previous.json.count | int == 1
    - __controller_secret_configs_previous.json.results[0].id | int != __controller_secret_configs_credential_id | int
    - >-
      __controller_secret_configs_previous.json.results[0].id | int in
      __controller_secret_configs_associations.json.results | map(attribute='id') | list
  changed_when: true
  no_log: true
