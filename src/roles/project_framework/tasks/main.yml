---
- name: Resolve runtime account for project framework
  tags: [operator_docs, connector_prompt_template]
  ansible.builtin.getent:
    database: passwd
    key: "{{ containers.runtime_user }}"
- name: Define project framework paths
  tags: [operator_docs, connector_prompt_template]
  ansible.builtin.set_fact:
    __project_framework_home: "{{ ansible_facts.getent_passwd[containers.runtime_user][4] }}"
    __project_framework_uid: "{{ ansible_facts.getent_passwd[containers.runtime_user][1] }}"
- name: Create project parent without changing existing projects
  ansible.builtin.file:
    path: "{{ __project_framework_home }}/projects"
    state: directory
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0700"
- name: Inspect archive parent without following links
  ansible.builtin.stat:
    path: "{{ __project_framework_home }}/project-archive"
    follow: false
  register: __project_framework_archive_parent
- name: Require an ordinary archive directory before maintaining permissions
  ansible.builtin.assert:
    that:
      - not (__project_framework_archive_parent.stat.islnk | default(false))
      - not __project_framework_archive_parent.stat.exists or __project_framework_archive_parent.stat.isdir | default(false)
    quiet: true
- name: Create protected archive parent without moving existing projects
  ansible.builtin.file:
    path: "{{ __project_framework_home }}/project-archive"
    state: directory
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0700"
- name: Install shared actual project name and socket path validator
  ansible.builtin.copy:
    src: "{{ role_path }}/../../lib/project-names.py"
    dest: "{{ __project_framework_home }}/agents-connector/routing/project-names.py"
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0600"

- name: Install project-scoped operator control
  tags: [connector_prompt_template]
  ansible.builtin.copy:
    src: project-team.py
    dest: "{{ __project_framework_home }}/agents-connector/routing/project-team.py"
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0700"
- name: Install strict non-secret environment and assignment configuration
  tags: [native_auth]
  ansible.builtin.copy:
    src: environment-config.py
    dest: "{{ __project_framework_home }}/agents-connector/routing/environment-config.py"
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0600"
- name: Install bounded environment metadata diagnostics
  ansible.builtin.copy:
    src: environment-diagnostics.py
    dest: "{{ __project_framework_home }}/agents-connector/routing/environment-diagnostics.py"
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0600"
- name: Create protected primary target diagnostics directory
  ansible.builtin.file:
    path: "{{ __project_framework_home }}/environment-logs"
    state: directory
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0700"
- name: Install central source version
  tags: [operator_docs]
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../VERSION"
    dest: "{{ __project_framework_home }}/agents-connector/VERSION"
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0600"
- name: Install source commit metadata without environment identifiers
  tags: [operator_docs]
  ansible.builtin.copy:
    dest: "{{ __project_framework_home }}/agents-connector/build-info.json"
    content: >-
      {{ {'version': lookup('file', role_path + '/../../../VERSION') | trim, 'commit': assistant_build_commit | default(awx_project_revision
      | default(lookup('env',
      'ASSISTANT_BUILD_COMMIT') | default('development-uncommitted', true)))} | to_nice_json }}
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0600"
- name: Install project-aware existing lifecycle and IPC implementation
  ansible.builtin.copy:
    src: "{{ role_path }}/../agents_connector/files/connector-team.py"
    dest: "{{ __project_framework_home }}/agents-connector/routing/connector-team.py"
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0700"
- name: Install project instance services and target without enabling projects
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ __project_framework_home }}/.config/systemd/user/{{ item }}"
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0600"
  loop:
    - assistant-connector@.target
    - assistant-connector-broker@.service
    - assistant-connector-gateway@.service
    - assistant-connector-containers@.service
- name: Reload project unit definitions without restarting active work
  become: true
  become_user: "{{ containers.runtime_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ __project_framework_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ __project_framework_uid }}/bus"
  ansible.builtin.systemd_service:
    scope: user
    daemon_reload: true
- name: Publish actual home-local project commands
  tags: [operator_docs]
  ansible.builtin.template:
    src: "{{ role_path }}/../agents_connector/templates/README.md.j2"
    dest: "{{ __project_framework_home }}/README.md"
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0600"
- name: Install explicit model-free project validation
  ansible.builtin.copy:
    src: validate_projects.py
    dest: "{{ __project_framework_home }}/agents-connector/routing/validate_projects.py"
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0700"
- name: Publish concise operator guide
  tags: [operator_docs]
  ansible.builtin.template:
    src: README.TLDR.md.j2
    dest: "{{ __project_framework_home }}/README.TLDR.md"
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0600"

- name: Install explicit project prompt migration helper
  ansible.builtin.copy:
    src: migrate-prompts.py
    dest: "{{ __project_framework_home }}/agents-connector/routing/migrate-prompts.py"
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0700"
- name: Validate explicitly selected prompt migration projects
  ansible.builtin.assert:
    that: item is match('^[a-z0-9][a-z0-9-]*$')
    fail_msg: Prompt migration requires valid project names.
  loop: "{{ project_framework_migrate_prompt_projects }}"
- name: Migrate explicitly selected existing project prompts without restarting sessions
  become: true
  become_user: "{{ containers.runtime_user }}"
  ansible.builtin.command:
    argv:
      - python3
      - "{{ __project_framework_home }}/agents-connector/routing/migrate-prompts.py"
      - "{{ __project_framework_home }}/projects/{{ item }}/assistant-prompt.md"
  loop: "{{ project_framework_migrate_prompt_projects }}"
  register: __project_framework_prompt_migration
  changed_when: "'changed=true' in __project_framework_prompt_migration.stdout"
  no_log: true

- name: Install safe project restore and identity helpers
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ __project_framework_home }}/agents-connector/routing/{{ item }}"
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0600"
  loop:
    - unarchive-project.py
    - project-identity.py
