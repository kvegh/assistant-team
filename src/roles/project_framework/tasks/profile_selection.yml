---
- name: Define supported initial account profiles
  ansible.builtin.set_fact:
    __project_framework_supported_profiles:
      - claude-work
      - claude-priv
      - gemini-work
      - gemini-priv
      - codex-work
      - codex-priv
      - mistral-work
      - mistral-priv
- name: Require known unique initial account profiles
  ansible.builtin.assert:
    that:
      - project_framework_enabled_profiles is sequence
      - project_framework_enabled_profiles is not string
      - project_framework_enabled_profiles is not mapping
      - project_framework_enabled_profiles | difference(__project_framework_supported_profiles) | length == 0
      - project_framework_enabled_profiles | unique | length == project_framework_enabled_profiles | length
    quiet: true
    fail_msg: Initial profile selection must contain only known work/private profile names, without duplicates.
- name: Apply explicit initial selection while preserving existing configuration by default
  when: project_framework_enabled_profiles | length > 0
  ansible.builtin.template:
    src: environment.conf.j2
    dest: "{{ __project_framework_home }}/conf/environment.conf"
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: '0600'
    force: "{{ project_framework_reconcile_profiles | bool }}"
