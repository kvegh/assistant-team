---
- name: Resolve protected destination installation layout
  tags: [always]
  ansible.builtin.include_role:
    name: install_layout
    apply:
      tags: [always]
- name: Resolve Gemini account directory owner
  ansible.builtin.getent:
    database: passwd
    key: "{{ containers.runtime_user }}"
- name: Define work Gemini migration home
  ansible.builtin.set_fact:
    __gemini_account_home: "{{ assistant_profiles_root }}"
- name: Safely migrate the old Gemini directory without changing its contents
  become: true
  become_user: "{{ containers.runtime_user }}"
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import os,pathlib
        home=pathlib.Path.home();old=home/'{{ item.old }}';new=home/'{{ item.new }}'
        if not old.exists():
            print('unchanged');raise SystemExit(0)
        if old.is_symlink() or new.exists():raise SystemExit('Gemini migration requires an absent destination and real source directory; no files changed')
        for p in pathlib.Path('/proc').iterdir():
            if not p.name.isdigit():continue
            try:
                if p.stat().st_uid!=os.getuid():continue
                args=(p/'cmdline').read_bytes().split(b'\0')
                if any(a.startswith(str(old).encode()+b'/') for a in args):
                    raise SystemExit('Native login/CLI is active; wait for it to finish before directory migration')
            except (OSError,PermissionError):pass
        old.rename(new)
        print('migrated')
    chdir: /tmp
  environment:
    HOME: "{{ __gemini_account_home }}"
  loop:
    - { old: gemini, new: gemini-work }
    - { old: codex, new: codex-priv }
    - { old: mistral, new: mistral-priv }
  register: __gemini_account_move
  changed_when: "'migrated' in __gemini_account_move.stdout"
