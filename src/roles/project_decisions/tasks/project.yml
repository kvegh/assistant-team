---
- name: Inspect shared workspace before writing
  ansible.builtin.stat:
    path: "{{ item.item.path }}/workspace"
    follow: false
  register: __project_decisions_workspace
- name: Refuse redirected shared workspace
  ansible.builtin.assert:
    that:
      - not __project_decisions_workspace.stat.islnk | default(false)
      - not __project_decisions_workspace.stat.exists or __project_decisions_workspace.stat.isdir | default(false)
- name: Create shared project workspace when missing
  ansible.builtin.file:
    path: "{{ item.item.path }}/workspace"
    state: directory
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0700"
    follow: false
- name: Inspect existing decision log without following links
  ansible.builtin.stat:
    path: "{{ item.item.path }}/workspace/DECISIONS.log"
    follow: false
  register: __project_decisions_log
- name: Refuse nonregular decision log destination
  ansible.builtin.assert:
    that:
      - not __project_decisions_log.stat.islnk | default(false)
      - not __project_decisions_log.stat.exists or __project_decisions_log.stat.isreg | default(false)
- name: Initialize decision log without changing existing contents
  ansible.builtin.copy:
    dest: "{{ item.item.path }}/workspace/DECISIONS.log"
    content: ""
    force: false
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0600"
- name: Refresh owned decision log instruction blocks without replacing user prompts
  become: true
  become_user: "{{ containers.runtime_user }}"
  environment:
    ASSISTANT_PROJECT: "{{ item.item.path | basename }}"
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - >-
        import importlib.util, sys;
        spec = importlib.util.spec_from_file_location('decision_instructions', sys.argv[1]);
        module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module);
        print('changed' if module.update_decision_log_instructions() else 'unchanged')
      - "{{ ansible_facts.getent_passwd[containers.runtime_user][4] }}/agents-connector/routing/connector-team.py"
  register: __project_decisions_instructions
  changed_when: __project_decisions_instructions.stdout == 'changed'
