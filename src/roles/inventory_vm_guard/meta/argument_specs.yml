---
argument_specs:
  main:
    short_description: Resolve lifecycle targets from live authoritative AAP inventory.
    options:
      inventory_vm_guard_name:
        type: str
        required: true
      inventory_vm_guard_require_existing:
        type: bool
        default: true
      inventory_vm_guard_operation:
        type: str
        default: retire
        choices: [retire, shutdown, lookup]
