---
- name: Create each installation and all mutable state directories
  ansible.builtin.file:
    path: "{{ __native_auth_native_home }}/{{ native.directory }}/{{ item }}"
    state: directory
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0700"
  loop: [.install, .config, .cache, .local/share, .local/state, tmp, .claude, .codex, .gemini, .vibe]
- name: Inspect pinned local installation
  ansible.builtin.stat:
    path: "{{ __native_auth_native_home }}/{{ native.directory }}/.native-install.json"
  register: __native_auth_native_existing
- name: Require filesystem reserve before new local installations
  when: not __native_auth_native_existing.stat.exists
  block:
    - name: Inspect filesystem reserve
      ansible.builtin.command:
        argv: [df, -B1, --output=avail, /]
      register: __native_auth_native_free
      changed_when: false
    - name: Require filesystem reserve
      ansible.builtin.assert:
        that: __native_auth_native_free.stdout_lines[-1] | trim | int > 1073741824
        fail_msg: Native installation requires more free space; preserve the guest filesystem reserve.
- name: Clone only immutable program artifacts for another account context
  changed_when: true
  when: not __native_auth_native_existing.stat.exists and native.directory in ['codex-work', 'gemini-priv', 'mistral-work']
  vars:
    native_program_source: "{{ {'codex-work': 'codex-priv', 'gemini-priv': 'gemini-work', 'mistral-work': 'mistral-priv'}[native.directory] }}"
  ansible.builtin.command:
    argv:
      - cp
      - -al
      - "{{ __native_auth_native_home }}/{{ native_program_source }}/.install/{{ item }}"
      - "{{ __native_auth_native_home }}/{{ native.directory }}/.install/{{ item }}"
  loop: "{{ (native.directory == 'gemini-priv') | ternary(['lib'], ['bin', 'lib']) }}"
- name: Export the real native package into its home-local prefix
  changed_when: true
  when: not __native_auth_native_existing.stat.exists and native.flavour != 'vibe' and native.directory not in ['claude-priv', 'codex-work', 'gemini-priv']
  ansible.builtin.shell: |
    set -o pipefail
    runuser -u {{ containers.runtime_user | quote }} -- env \
      HOME={{ __native_auth_native_home | quote }} XDG_RUNTIME_DIR=/run/user/{{ __native_auth_native_uid }} \
      podman run --rm --network=none localhost/assistant-connector-{{ native.flavour }}:{{ native.version }} \
      tar -C /usr/local -cf - lib/node_modules/{{ native.package }} \
      {{ (native.flavour == 'codex') | ternary('bin/node', '') }} |
    runuser -u {{ containers.runtime_user | quote }} -- tar -C {{ (__native_auth_native_home + '/' + native.directory + '/.install') | quote }} -xf -
  args:
    executable: /bin/bash
    chdir: /tmp
  async: 600
  poll: 20
- name: Share only immutable duplicate Claude program files through hard links
  changed_when: true
  when: not __native_auth_native_existing.stat.exists and native.directory == 'claude-priv'
  ansible.builtin.command:
    argv: [cp, -al, "{{ __native_auth_native_home }}/claude-work/.install/.", "{{ __native_auth_native_home }}/claude-priv/.install/"]
- name: Share only immutable Node executable through a hard link
  when: native.flavour == 'gemini'
  block:
    - name: Prepare protected runtime paths
      ansible.builtin.file:
        path: "{{ __native_auth_native_home }}/{{ native.directory }}/.install/bin"
        state: directory
        owner: "{{ containers.runtime_user }}"
        group: "{{ containers.runtime_user }}"
        mode: "0700"
    - name: Inspect immutable Node executable permissions
      ansible.builtin.stat:
        path: "{{ __native_auth_native_home }}/codex-priv/.install/bin/node"
      register: native_auth_node_artifact
    - name: Link the immutable Node executable while preserving its mode
      ansible.builtin.file:
        src: "{{ __native_auth_native_home }}/codex-priv/.install/bin/node"
        dest: "{{ __native_auth_native_home }}/{{ native.directory }}/.install/bin/node"
        state: hard
        mode: "{{ native_auth_node_artifact.stat.mode }}"
        owner: "{{ containers.runtime_user }}"
        group: "{{ containers.runtime_user }}"
- name: Export the installed Vibe Python runtime and packages from the original native image
  changed_when: true
  when: not __native_auth_native_existing.stat.exists and native.flavour == 'vibe' and native.directory != 'mistral-work'
  ansible.builtin.shell: |
    set -o pipefail
    source_uid=$(id -u {{ assistant_source_user | quote }})
    runuser -u {{ assistant_source_user | quote }} -- env \
      HOME=/home/{{ assistant_source_user | quote }} XDG_RUNTIME_DIR=/run/user/$source_uid \
      podman run --rm --network=none localhost/assistant-team-vibe:{{ native.version }} \
      tar -C /usr/local -cf - bin lib |
    runuser -u {{ containers.runtime_user | quote }} -- tar -C {{ (__native_auth_native_home + '/' + native.directory + '/.install') | quote }} -xf -
  args:
    executable: /bin/bash
    chdir: /tmp
  async: 600
  poll: 20
- name: Mark reused compatible work Python runtime
  when: not __native_auth_native_existing.stat.exists and native.directory == 'mistral-work'
  ansible.builtin.copy:
    dest: "{{ __native_auth_native_home }}/mistral-work/.install/.portable-python-version"
    content: "3.12.15+20261003\n"
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0600"
- name: Inspect compatible Python runtime installation
  when: native.flavour == 'vibe'
  ansible.builtin.stat:
    path: "{{ __native_auth_native_home }}/{{ native.directory }}/.install/.portable-python-version"
  register: __native_auth_native_python_runtime
- name: Install a RHEL-compatible pinned Python runtime for Vibe
  when: native.flavour == 'vibe' and not __native_auth_native_python_runtime.stat.exists
  block:
    - name: Download official portable Python
      ansible.builtin.get_url:
        url:
          https://github.com/astral-sh/python-build-standalone/releases/download/20261003/cpython-3.12.15%2B20261003-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz
        checksum: sha256:731af898886c5f821890dc901eca3c651cca8e51fa7308c159d12a1194aeac91
        dest: "{{ __native_auth_native_home }}/{{ native.directory }}/.install/python-runtime.tar.gz"
        owner: "{{ containers.runtime_user }}"
        group: "{{ containers.runtime_user }}"
        mode: "0600"
    - name: Extract compatible runtime while retaining Vibe packages
      ansible.builtin.unarchive:
        src: "{{ __native_auth_native_home }}/{{ native.directory }}/.install/python-runtime.tar.gz"
        dest: "{{ __native_auth_native_home }}/{{ native.directory }}/.install"
        remote_src: true
        extra_opts: [--strip-components=1]
        owner: "{{ containers.runtime_user }}"
        group: "{{ containers.runtime_user }}"
- name: Record the compatible portable runtime
  when: native.flavour == 'vibe'
  ansible.builtin.copy:
    dest: "{{ __native_auth_native_home }}/{{ native.directory }}/.install/.portable-python-version"
    content: "3.12.15+20261003\n"
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0600"
- name: Install directory-scoped native CLI launcher
  ansible.builtin.copy:
    src: native-cli.py
    dest: "{{ __native_auth_native_home }}/{{ native.directory }}/.native-cli.py"
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0700"
- name: Install required login helper before invoking the native launcher
  ansible.builtin.copy:
    src: login-result.py
    dest: "{{ __native_auth_native_home }}/{{ native.directory }}/.login-result.py"
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0600"
- name: Publish native installation metadata
  ansible.builtin.copy:
    dest: "{{ __native_auth_native_home }}/{{ native.directory }}/.native-install.json"
    content: "{{ native | to_nice_json }}\n"
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0600"
- name: Provide the simple native CLI and login commands
  ansible.builtin.file:
    src: .native-cli.py
    dest: "{{ __native_auth_native_home }}/{{ native.directory }}/{{ item }}"
    state: link
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
  loop: ["{{ native.flavour }}", login]
- name: Verify actual host-native CLI version without credentials or inference
  become: true
  become_user: "{{ containers.runtime_user }}"
  ansible.builtin.command:
    argv: ["{{ __native_auth_native_home }}/{{ native.directory }}/{{ native.flavour }}", --version]
    chdir: "{{ __native_auth_native_home }}/{{ native.directory }}"
  register: __native_auth_native_version_check
  changed_when: false
  failed_when: __native_auth_native_version_check.rc != 0 or native.version not in __native_auth_native_version_check.stdout +
    __native_auth_native_version_check.stderr
- name: Verify local native help without credentials or inference
  become: true
  become_user: "{{ containers.runtime_user }}"
  ansible.builtin.command:
    argv: ["{{ __native_auth_native_home }}/{{ native.directory }}/{{ native.flavour }}", --help]
    chdir: "{{ __native_auth_native_home }}/{{ native.directory }}"
  changed_when: false
