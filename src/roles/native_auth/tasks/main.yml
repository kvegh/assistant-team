---
- name: Resolve the dedicated native installation account
  tags: [native_auth_helpers]
  ansible.builtin.getent:
    database: passwd
    key: "{{ containers.runtime_user }}"
- name: Define dedicated local installation paths
  tags: [native_auth_helpers]
  ansible.builtin.set_fact:
    __native_auth_native_home: "{{ ansible_facts.getent_passwd[containers.runtime_user][4] }}"
    __native_auth_native_uid: "{{ ansible_facts.getent_passwd[containers.runtime_user][1] }}"
- name: Install supported personal Antigravity before maintaining shared launchers
  ansible.builtin.include_role:
    name: antigravity_auth
  vars:
    antigravity_auth_profile_home: "{{ __native_auth_native_home }}/gemini-priv"
    antigravity_auth_runtime_user: "{{ containers.runtime_user }}"
  when: native_auth_native_auth_dirs | selectattr('directory', 'equalto', 'gemini-priv') | list | length > 0
- name: Inspect installed contexts before focused account provisioning
  ansible.builtin.stat:
    path: "{{ __native_auth_native_home }}/{{ item.directory }}/.native-install.json"
  loop: "{{ native_auth_native_auth_dirs }}"
  register: __native_auth_native_contexts
- name: Install real native packages and scoped launchers sequentially
  ansible.builtin.include_tasks: install.yml
  loop: "{{ __native_auth_native_contexts.results | rejectattr('stat.exists') | map(attribute='item') | list }}"
  loop_control:
    loop_var: native
- name: Maintain secret-free login outcome reporting in every installed context
  tags: [native_auth_helpers]
  ansible.builtin.copy:
    src: login-result.py
    dest: "{{ __native_auth_native_home }}/{{ item.directory }}/.login-result.py"
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0600"
  loop: "{{ native_auth_native_auth_dirs }}"
- name: Maintain scoped launchers without changing credentials or installation metadata
  tags: [native_auth_helpers]
  ansible.builtin.copy:
    src: native-cli.py
    dest: "{{ __native_auth_native_home }}/{{ item.directory }}/.native-cli.py"
    owner: "{{ containers.runtime_user }}"
    group: "{{ containers.runtime_user }}"
    mode: "0700"
  loop: "{{ native_auth_native_auth_dirs }}"
- name: Verify every installed native version including recovered contexts
  become: true
  become_user: "{{ containers.runtime_user }}"
  ansible.builtin.command:
    argv: ["{{ __native_auth_native_home }}/{{ item.directory }}/{{ item.flavour }}", --version]
    chdir: "{{ __native_auth_native_home }}/{{ item.directory }}"
  loop: "{{ native_auth_native_auth_dirs }}"
  register: __native_auth_native_all_versions
  changed_when: false
  failed_when: __native_auth_native_all_versions.rc != 0 or item.version not in __native_auth_native_all_versions.stdout +
    __native_auth_native_all_versions.stderr
