- name: Require the explicit normal upstream mode and its immutable inputs
  ansible.builtin.assert:
    that:
      - linux_vm_recovery is not defined
      - linux_vm_upstream is mapping
      - linux_vm_upstream.keys() | list | sort == ['generic_image', 'golden_image_path', 'hypervisor_pin', 'network_bridge',
        'source_image_sha256', 'update_packages', 'vm_dir', 'vm_domain', 'vm_name', 'vm_network'] | sort
      - __linux_vm_environment is mapping
      - __linux_vm_environment.provisioning is mapping
      - linux_vm_upstream.vm_name == linux_vm_deployment_name
      - provisioning.golden_image_path == linux_vm_upstream.golden_image_path
      - provisioning.source_image_sha256 == linux_vm_upstream.source_image_sha256
      - provisioning.hypervisor_pin == linux_vm_upstream.hypervisor_pin
      - provisioning.network_bridge == linux_vm_upstream.network_bridge
      - provisioning.vm_network == linux_vm_upstream.vm_network
      - provisioning.vm_dir == linux_vm_upstream.vm_dir
      - provisioning.vm_domain == linux_vm_upstream.vm_domain
      - provisioning.guest_ssh_user == __linux_vm_environment.provisioning.guest_ssh_user
      - provisioning.guest_ssh_password == __linux_vm_environment.provisioning.guest_ssh_password
      - provisioning.guest_become_password == __linux_vm_environment.provisioning.guest_become_password
      - provisioning.hypervisor_pin | linux_vm_recovery_pin(ansible_host) is mapping
      - provisioning.generic_image is boolean and provisioning.generic_image
      - provisioning.update_packages is boolean and not provisioning.update_packages
      - provisioning.source_image_sha256 is match('^[0-9a-f]{64}$')
      - provisioning.network_bridge is match('^[A-Za-z0-9_.-]{1,15}$')
      - provisioning.guest_ssh_user is match('^[a-z_][a-z0-9_-]*$')
      - provisioning.guest_ssh_user != 'root'
      - provisioning.guest_ssh_password is string or provisioning.guest_ssh_password is vault_encrypted
      - provisioning.guest_ssh_password | length > 0
      - provisioning.guest_become_password == provisioning.guest_ssh_password
    fail_msg: Normal upstream image deployment requires explicit pinned identity and disabled updates; it does not
      apply recovery policy.
  no_log: true
- name: Allocate private controller-side hypervisor trust
  ansible.builtin.tempfile:
    state: file
    prefix: linux-vm-recovery-known-hosts-
  delegate_to: localhost
  become: false
  register: __linux_vm_recovery_trust
  check_mode: false
- name: Write only the pinned hypervisor public host keys
  ansible.builtin.copy:
    dest: '{{ __linux_vm_recovery_trust.path }}'
    content: '{% for key in provisioning.hypervisor_pin.host_keys %}

      {{ provisioning.hypervisor_pin.address }} {{ key }}

      [{{ provisioning.hypervisor_pin.address }}]:{{ provisioning.hypervisor_pin.port }} {{ key }}

      {% endfor %}

      '
    mode: '0600'
  delegate_to: localhost
  become: false
  check_mode: false
  no_log: true
- name: Bind remote actions to the pinned managed account and SSH keys
  ansible.builtin.set_fact:
    ansible_user: '{{ provisioning.hypervisor_pin.user }}'
    ansible_port: '{{ provisioning.hypervisor_pin.port }}'
    ansible_password: ''
    ansible_become_password: ''
    ansible_become_user: root
    ansible_host_key_checking: true
    ansible_ssh_host_key_checking: true
    ansible_ssh_common_args: -o StrictHostKeyChecking=yes -o UserKnownHostsFile={{ __linux_vm_recovery_trust.path
      | quote }}
  no_log: true
- name: Verify the actual normal upstream hypervisor identity before a disk write
  ansible.builtin.command:
    argv:
      - cat
      - /etc/machine-id
  changed_when: false
  check_mode: false
  register: __linux_vm_recovery_machine
  failed_when: __linux_vm_recovery_machine.stdout | trim != provisioning.hypervisor_pin.machine_id
  no_log: true
- name: Read the selected normal upstream network before disk creation
  ansible.builtin.command:
    argv:
      - virsh
      - -c
      - qemu:///system
      - net-dumpxml
      - '{{ provisioning.vm_network }}'
  register: __linux_vm_upstream_network_xml
  changed_when: false
  check_mode: false
  no_log: true
- name: Require the exact normal upstream network bridge
  ansible.builtin.assert:
    that: __linux_vm_upstream_network_xml.stdout | linux_vm_recovery_bridge(provisioning.vm_network, [provisioning.network_bridge])
      == provisioning.network_bridge
  no_log: true
- name: Inspect the generic source without following symlinks
  ansible.builtin.stat:
    path: '{{ provisioning.golden_image_path }}'
    follow: false
    checksum_algorithm: sha256
  register: __linux_vm_source_image
  no_log: true
- name: Require a regular saved generic image
  ansible.builtin.assert:
    that:
      - __linux_vm_source_image.stat.isreg | default(false)
      - not (__linux_vm_source_image.stat.islnk | default(false))
      - __linux_vm_source_image.stat.checksum | length == 64
      - __linux_vm_source_image.stat.checksum == provisioning.source_image_sha256
    fail_msg: The normal upstream image must be the exact regular standalone source selected by its saved SHA256.
  no_log: true
