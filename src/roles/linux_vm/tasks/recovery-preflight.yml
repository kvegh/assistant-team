---
- name: Require the declared recovery target and isolated generic-image inputs
  ansible.builtin.assert:
    that:
      - provisioning.hypervisor_pin | linux_vm_recovery_pin(ansible_host) is mapping
      - provisioning.generic_image | default(false) | bool
      - provisioning.isolation_policy is mapping
      - provisioning.isolation_policy.bridges | length > 0
      - provisioning.guest_ssh_user is match('^[a-z_][a-z0-9_-]*$')
      - provisioning.guest_ssh_user != 'root'
      - provisioning.guest_ssh_password is string or provisioning.guest_ssh_password is vault_encrypted
      - provisioning.guest_ssh_password | length > 0
      - provisioning.guest_become_password == provisioning.guest_ssh_password
      - aap_hactar_source_revision is defined
      - aap_hactar_source_revision is match('^[0-9a-f]{40}$')
      - hactar_source_public_ip is defined
      - hactar_source_public_ip is string
    fail_msg: Use the verified recovery inventory and explicit generic guest bootstrap inputs.
  no_log: true

- name: Allocate private controller-side hypervisor trust
  ansible.builtin.tempfile:
    state: file
    prefix: linux-vm-recovery-known-hosts-
  delegate_to: localhost
  become: false
  register: __linux_vm_recovery_trust
  check_mode: false

- name: Write only the pinned hypervisor public host keys
  ansible.builtin.copy:
    dest: "{{ __linux_vm_recovery_trust.path }}"
    content: |
      {% for key in provisioning.hypervisor_pin.host_keys %}
      {{ provisioning.hypervisor_pin.address }} {{ key }}
      [{{ provisioning.hypervisor_pin.address }}]:{{ provisioning.hypervisor_pin.port }} {{ key }}
      {% endfor %}
    mode: '0600'
  delegate_to: localhost
  become: false
  check_mode: false
  no_log: true

- name: Bind remote actions to the pinned managed account and SSH keys
  ansible.builtin.set_fact:
    ansible_user: "{{ provisioning.hypervisor_pin.user }}"
    ansible_port: "{{ provisioning.hypervisor_pin.port }}"
    ansible_password: ''
    ansible_become_password: ''
    ansible_become_user: root
    ansible_host_key_checking: true
    ansible_ssh_host_key_checking: true
    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=yes -o UserKnownHostsFile={{ __linux_vm_recovery_trust.path | quote }}
  no_log: true

- name: Verify the actual recovery hypervisor identity before a disk write
  ansible.builtin.command:
    argv: [cat, /etc/machine-id]
  changed_when: false
  check_mode: false
  register: __linux_vm_recovery_machine
  failed_when: __linux_vm_recovery_machine.stdout | trim != provisioning.hypervisor_pin.machine_id
  no_log: true

- name: Read the same public lifecycle dependency used for final guest release
  ansible.builtin.include_vars:
    file: '{{ role_path }}/../linux_recovery_release/defaults/main.yml'
    name: __linux_vm_firewall_dependency

- name: Require the reviewed immutable public implementation before native readback
  ansible.builtin.assert:
    that:
      - __linux_vm_firewall_dependency.linux_recovery_release_repository == 'https://github.com/kvegh/aap_autodeploy_configascode.git'
      - __linux_vm_firewall_dependency.linux_recovery_release_revision is match('^[0-9a-f]{40}$')
      - __linux_vm_firewall_dependency.linux_recovery_release_revision != '0000000000000000000000000000000000000000'
    quiet: true
  no_log: true

- name: Allocate this preflight's public source workspace in the execution environment
  ansible.builtin.tempfile:
    state: directory
    prefix: linux-vm-firewall-source-
  delegate_to: localhost
  become: false
  check_mode: false
  register: __linux_vm_firewall_source

- name: Verify current native firewall state before any image or disk operation
  vars:
    aap_isolation_autodeploy_root: '{{ __linux_vm_firewall_source.path }}/source'
    aap_isolation_hypervisor: '{{ provisioning.hypervisor_pin }}'
    aap_isolation_trust_file: '{{ __linux_vm_recovery_trust.path }}'
  block:
    - name: Fetch the same exact public implementation as final release
      ansible.builtin.git:
        repo: '{{ __linux_vm_firewall_dependency.linux_recovery_release_repository }}'
        version: '{{ __linux_vm_firewall_dependency.linux_recovery_release_revision }}'
        dest: '{{ __linux_vm_firewall_source.path }}/source'
        update: false
        recursive: false
      delegate_to: localhost
      become: false
      check_mode: false

    - name: Prepare only a native readback transaction on the pinned hypervisor
      ansible.builtin.include_tasks: '{{ __linux_vm_firewall_source.path }}/source/tasks/aap-isolation-prepare.yml'
      vars:
        aap_isolation_autodeploy_root: '{{ __linux_vm_firewall_source.path }}/source'
      register: __linux_vm_firewall_prepare

    - name: Require complete native agreement with existing source CaC without applying it
      ansible.builtin.include_tasks: '{{ __linux_vm_firewall_source.path }}/source/tasks/aap-isolation-observe.yml'
      vars:
        aap_isolation_previous_policy: '{{ provisioning.isolation_policy }}'
        aap_isolation_desired_policy: '{{ provisioning.isolation_policy }}'
        aap_isolation_require_match: true

  always:
    - name: Release this preflight's native lock and temporary Hactar source
      ansible.builtin.include_tasks: '{{ __linux_vm_firewall_source.path }}/source/tasks/aap-isolation-finish.yml'
      when: __linux_vm_firewall_prepare is defined

    - name: Remove only this preflight's public implementation workspace
      ansible.builtin.file:
        path: '{{ __linux_vm_firewall_source.path }}'
        state: absent
      delegate_to: localhost
      become: false
      check_mode: false
      when: __linux_vm_firewall_source.path is match('^/tmp/linux-vm-firewall-source-[A-Za-z0-9_]+$')

- name: Inspect the generic source without following symlinks
  ansible.builtin.stat:
    path: "{{ provisioning.golden_image_path }}"
    follow: false
    checksum_algorithm: sha256
  register: __linux_vm_source_image
  no_log: true

- name: Require a regular saved generic image
  ansible.builtin.assert:
    that:
      - __linux_vm_source_image.stat.isreg | default(false)
      - not (__linux_vm_source_image.stat.islnk | default(false))
      - __linux_vm_source_image.stat.checksum | length == 64
    fail_msg: Select the already verified regular upstream image on the recovery hypervisor.
  no_log: true
