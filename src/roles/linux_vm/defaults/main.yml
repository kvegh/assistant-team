---
linux_vm_deployment_name: "{{ vm_name | default(provisioning.vm_name) }}"
linux_vm_vcpus: "{{ vm_vcpus | default(2) }}"
linux_vm_memory_mb: "{{ vm_memory_mb | default(4096) }}"
linux_vm_disk_gb: "{{ vm_disk_gb | default(provisioning.vm_disk_gb | default(20)) }}"
linux_vm_deployment_disk: "{{ provisioning.vm_dir }}/{{ linux_vm_deployment_name }}.disk.qcow2"
