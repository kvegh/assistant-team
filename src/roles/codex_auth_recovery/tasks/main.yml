---
- name: Require explicit distinct endpoints and private account bindings
  ansible.builtin.assert:
    that:
      - codex_auth_recovery_source_host in hostvars
      - codex_auth_recovery_source_host != inventory_hostname
      - codex_auth_recovery_runtime_user | length > 0
      - codex_auth_recovery_source_role is match('^/')
      - codex_auth_recovery_source_home == codex_auth_recovery_source_role + '/accounts/codex-priv/home'
      - codex_auth_recovery_destination_profiles_root is match('^/')
      - codex_auth_recovery_destination_environment_config is match('^/')
      - codex_auth_recovery_report_directory is match('^/')
    quiet: true

- name: Validate and explicitly recover one same-account Codex credential stream
  become: true
  become_user: "{{ codex_auth_recovery_runtime_user }}"
  no_log: true
  diff: false
  block:
    - name: Allocate private source helper storage without credentials
      ansible.builtin.tempfile:
        state: directory
        prefix: ac-codex-recovery-
      delegate_to: "{{ codex_auth_recovery_source_host }}"
      register: codex_auth_recovery_source_temporary

    - name: Allocate private destination helper storage without credentials
      ansible.builtin.tempfile:
        state: directory
        prefix: ac-codex-recovery-
      register: codex_auth_recovery_destination_temporary

    - name: Install source validation helpers
      ansible.builtin.copy:
        src: "{{ item.source }}"
        dest: "{{ codex_auth_recovery_source_temporary.path }}/{{ item.name }}"
        mode: '0700'
      delegate_to: "{{ codex_auth_recovery_source_host }}"
      loop: &helpers
        - source: codex-auth-recovery.py
          name: codex-auth-recovery.py
        - source: "{{ role_path }}/../native_auth_transfer/files/native-auth-transfer.py"
          name: native-auth-transfer.py

    - name: Install destination validation helpers
      ansible.builtin.copy:
        src: "{{ item.source }}"
        dest: "{{ codex_auth_recovery_destination_temporary.path }}/{{ item.name }}"
        mode: '0700'
      loop: *helpers

    - name: Validate the explicitly selected archived role stream
      ansible.builtin.command:
        argv: >-
          {{ ['python3', codex_auth_recovery_source_temporary.path + '/codex-auth-recovery.py', 'capture',
          '--source-role', codex_auth_recovery_source_role, '--source-home', codex_auth_recovery_source_home] }}
      delegate_to: "{{ codex_auth_recovery_source_host }}"
      changed_when: false
      register: codex_auth_recovery_capture

    - name: Atomically replace only existing same-account target credentials
      ansible.builtin.command:
        argv: >-
          {{ ['python3', codex_auth_recovery_destination_temporary.path + '/codex-auth-recovery.py', 'replace',
          '--profiles-root', codex_auth_recovery_destination_profiles_root,
          '--environment-config', codex_auth_recovery_destination_environment_config]
          + (codex_auth_recovery_execute | bool | ternary([], ['--validate-only'])) }}
        stdin: "{{ codex_auth_recovery_capture.stdout | from_json | to_json }}"
        stdin_add_newline: false
      register: codex_auth_recovery_restore
      changed_when: (codex_auth_recovery_restore.stdout | from_json).changed | bool

    - name: Retain only safe stream provenance and recovery outcomes
      ansible.builtin.set_fact:
        codex_auth_recovery_public_result: "{{ codex_auth_recovery_restore.stdout | from_json }}"
        cacheable: false

    - name: Create private local audit storage
      ansible.builtin.file:
        path: "{{ codex_auth_recovery_report_directory }}"
        state: directory
        mode: '0700'

    - name: Save secret-free named stream provenance and model-unverified result
      ansible.builtin.copy:
        content: "{{ codex_auth_recovery_public_result | to_nice_json }}\n"
        dest: "{{ codex_auth_recovery_report_directory }}/codex-priv.json"
        mode: '0600'

  always:
    - name: Discard transient authentication payload facts
      ansible.builtin.set_fact:
        codex_auth_recovery_capture: {}
        codex_auth_recovery_restore: {}
        cacheable: false

    - name: Remove source helper storage created by this operation
      when: codex_auth_recovery_source_temporary.path is defined
      ansible.builtin.file:
        path: "{{ codex_auth_recovery_source_temporary.path }}"
        state: absent
      delegate_to: "{{ codex_auth_recovery_source_host }}"

    - name: Remove destination helper storage created by this operation
      when: codex_auth_recovery_destination_temporary.path is defined
      ansible.builtin.file:
        path: "{{ codex_auth_recovery_destination_temporary.path }}"
        state: absent

- name: Report safe recovery result without claiming model access
  ansible.builtin.debug:
    msg: "{{ codex_auth_recovery_public_result }}"
