---
- name: Recover one explicitly authorized same-account private Codex stream
  hosts: native_auth_destinations
  become: true
  gather_facts: false
  pre_tasks:
    - name: Load the external encrypted environment
      ansible.builtin.include_role:
        name: secret_config
        apply:
          tags: [always]
      vars:
        secret_config_name: environment
      tags: [always]
    - name: Load the external encrypted recovery definition
      ansible.builtin.include_role:
        name: secret_config
        apply:
          tags: [always]
      vars:
        secret_config_name: codex_auth_recovery
        secret_config_file: "{{ codex_auth_recovery_config_file | default('') }}"
      tags: [always]
  roles:
    - role: codex_auth_recovery
      tags: [codex_auth_recovery]
