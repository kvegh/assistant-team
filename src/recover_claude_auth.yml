---
- name: Recover one explicitly authorized same-account private Claude stream
  hosts: native_auth_destinations
  become: true
  gather_facts: false
  pre_tasks:
    - name: Load the external encrypted environment
      ansible.builtin.include_role:
        name: secret_config
        apply:
          tags: [always]
      vars:
        secret_config_name: environment
      tags: [always]
    - name: Load the external encrypted recovery definition
      ansible.builtin.include_role:
        name: secret_config
        apply:
          tags: [always]
      vars:
        secret_config_name: claude_auth_recovery
        secret_config_file: "{{ claude_auth_recovery_config_file | default('') }}"
      tags: [always]
  roles:
    - role: claude_auth_recovery
      tags: [claude_auth_recovery]
