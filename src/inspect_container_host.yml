---
- name: Discover the project guest from encrypted deployment details
  hosts: localhost
  gather_facts: false
  no_log: true
  pre_tasks:
    - name: Load encrypted environment without reserved variable collisions
      ansible.builtin.include_role:
        name: secret_config
        apply:
          tags: [always]
      vars:
        secret_config_name: environment
        secret_config_namespace: assistant_environment
      tags: [always]
    - name: Add the project guest
      ansible.builtin.add_host:
        name: assistant_container_host
        groups: assistant_container_hosts
        ansible_host: "{{ assistant_environment.environment.guest.linux_vm_ip }}"
        ansible_user: "{{ assistant_environment.provisioning.guest_ssh_user }}"
        ansible_password: "{{ assistant_environment.provisioning.guest_ssh_password }}"
        ansible_become_password: "{{ assistant_environment.provisioning.guest_become_password }}"
    - name: Inspect available execution environment collections
      ansible.builtin.command:
        argv: [ansible-galaxy, collection, list, --format, json]
      register: execution_collections
      changed_when: false

- name: Inspect container host without modifying it
  hosts: assistant_container_hosts
  gather_facts: false
  become: true
  no_log: true
  roles:
    - container_preflight
