---
- name: Deploy one Linux VM from a golden image
  hosts: hypervisor
  become: true
  gather_facts: false
  no_log: true
  tags: [provision]
  pre_tasks:
    - name: Load the external encrypted environment
      ansible.builtin.include_role:
        name: secret_config
        apply:
          tags: [always]
      vars:
        secret_config_name: environment
        secret_config_namespace: "{{ '__linux_vm_environment' if linux_vm_recovery is defined else '' }}"
      tags: [always]
    - name: Bind nonsecret recovery inputs to the existing encrypted guest login
      ansible.builtin.include_tasks:
        file: tasks/linux_vm_recovery_inputs.yml
        apply:
          tags: [always]
      when: linux_vm_recovery is defined
      tags: [always]
  roles:
    - linux_vm

- name: Verify the provisioned Linux guest
  hosts: provisioned_linux_guest
  gather_facts: false
  become: true
  no_log: true
  tags: [guest_config, offline_recovery]
  pre_tasks:
    - name: Load the external encrypted environment
      ansible.builtin.include_role:
        name: secret_config
        apply:
          tags: [always]
      vars:
        secret_config_name: environment
        secret_config_namespace: "{{ '__linux_vm_environment' if linux_vm_recovery is defined else '' }}"
      tags: [always]
    - name: Restore the same recovery inputs after the guest's encrypted environment load
      ansible.builtin.include_tasks:
        file: tasks/linux_vm_recovery_inputs.yml
        apply:
          tags: [always]
      when: linux_vm_recovery is defined
      tags: [always]
  roles:
    - linux_guest
    - linux_root_growth
    - role: linux_updates
      when: provisioning.update_packages | default(true) | bool
  tasks:
    - name: Publish verified generic guest provenance
      ansible.builtin.set_stats:
        data:
          generic_linux_vm: >-
            {{ deployment_vm_provenance | combine({
              'machine_id': ansible_facts.machine_id,
              'verified': true,
              'vcpus': deployment_vm_vcpus | int,
              'memory_mb': deployment_vm_memory_mb | int,
              'disk_gb': deployment_vm_disk_gb | int,
              'packages_updated': provisioning.update_packages | default(true) | bool}) }}
        per_host: false
        aggregate: false
      tags: [guest_config, offline_recovery]
