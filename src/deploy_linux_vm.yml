---
- name: Deploy one Linux VM from a golden image
  hosts: hypervisor
  become: true
  gather_facts: false
  no_log: true
  tags: [provision]
  vars_files:
    - ../vars/environment.vault.yml
  vars:
    deployment_name: "{{ vm_name | default(provisioning.vm_name) }}"
    vm_vcpus: 2
    vm_memory_mb: 4096
    vm_disk_gb: 40
    deployment_disk: "{{ provisioning.vm_dir }}/{{ deployment_name }}.disk.qcow2"

  tasks:
    - name: Validate deployment inputs
      tags: [offline_recovery]
      ansible.builtin.assert:
        that:
          - ansible_play_hosts_all | length == 1
          - deployment_name is match('^[a-z][a-z0-9-]{0,62}$')
          - vm_vcpus | int >= 1
          - vm_memory_mb | int >= 1024
          - vm_disk_gb | int >= 1
          - provisioning.golden_image_path is match('^/')
          - provisioning.vm_dir is match('^/')
          - provisioning.vm_domain | length > 0
          - provisioning.vm_network | length > 0
          - provisioning.guest_ssh_user | length > 0
        fail_msg: Invalid deployment inputs; check the Vault configuration and launch variables.

    - name: Inspect existing VM names
      tags: [offline_recovery]
      ansible.builtin.command:
        argv: [virsh, list, --all, --name]
      register: existing_vms
      changed_when: false

    - name: Inspect target disk
      tags: [offline_recovery]
      ansible.builtin.stat:
        path: "{{ deployment_disk }}"
      register: existing_disk

    - name: Validate offline recovery safety
      tags: [never, offline_recovery]
      when: "'offline_recovery' in ansible_run_tags"
      ansible.builtin.assert:
        that:
          - deployment_name not in existing_vms.stdout_lines
          - existing_disk.stat.exists
        fail_msg: Offline recovery requires an existing disk with no defined VM.

    - name: Refuse to overwrite an existing VM or disk
      ansible.builtin.assert:
        that:
          - deployment_name not in existing_vms.stdout_lines
          - not existing_disk.stat.exists
        fail_msg: The VM or disk already exists; investigate before retrying.

    - name: Inspect golden image
      ansible.builtin.command:
        argv: [qemu-img, info, --output=json, "{{ provisioning.golden_image_path }}"]
      register: golden_image
      changed_when: false

    - name: Refuse disk sizes smaller than the golden image
      ansible.builtin.assert:
        that:
          - (vm_disk_gb | int * 1073741824) >= ((golden_image.stdout | from_json)['virtual-size'] | int)
        fail_msg: Requested disk size is smaller than the source image; increase vm_disk_gb.

    - name: Ensure VM directory exists
      ansible.builtin.file:
        path: "{{ provisioning.vm_dir }}"
        state: directory
        mode: '0755'

    - name: Clone the golden image without overwriting a disk
      ansible.builtin.copy:
        src: "{{ provisioning.golden_image_path }}"
        dest: "{{ deployment_disk }}"
        remote_src: true
        force: false
        mode: '0600'

    - name: Resize the cloned disk
      ansible.builtin.command:
        argv: [qemu-img, resize, "{{ deployment_disk }}", "{{ vm_disk_gb | int }}G"]
      changed_when: true

    - name: Remove AAP installer artifacts and inherited clutter from the clone
      ansible.builtin.command:
        argv:
          - virt-customize
          - -a
          - "{{ deployment_disk }}"
          - --run-command
          - "{{ lookup('template', playbook_dir + '/templates/clean_linux_clone.sh.j2') }}"
      changed_when: true

    - name: Customize hostname and unique guest identity
      tags: [offline_recovery]
      no_log: "{{ not (vm_identity_diagnostics | default(false) | bool) }}"
      ansible.builtin.command:
        argv:
          - virt-customize
          - -a
          - "{{ deployment_disk }}"
          - --hostname
          - "{{ deployment_name }}.{{ provisioning.vm_domain }}"
          - --run-command
          - "{{ lookup('file', playbook_dir + '/reset_linux_identity.sh') }}"
          - --selinux-relabel
      changed_when: true

    - name: Import and start the VM
      tags: [offline_recovery]
      ansible.builtin.command:
        argv:
          - virt-install
          - --name
          - "{{ deployment_name }}"
          - --vcpus
          - "{{ vm_vcpus | int }}"
          - --memory
          - "{{ vm_memory_mb | int }}"
          - --import
          - --graphics
          - none
          - --osinfo
          - detect=on,require=off
          - --disk
          - "path={{ deployment_disk }},format=qcow2"
          - --network
          - "network={{ provisioning.vm_network }}"
          - --noautoconsole
      changed_when: true

    - name: Read the VM network interface
      tags: [guest_config, offline_recovery]
      ansible.builtin.command:
        argv: [virsh, domiflist, "{{ deployment_name }}"]
      register: vm_interfaces
      changed_when: false

    - name: Extract the VM MAC address
      tags: [guest_config, offline_recovery]
      ansible.builtin.set_fact:
        deployment_mac: "{{ vm_interfaces.stdout | regex_search('(?i)(?:[0-9a-f]{2}:){5}[0-9a-f]{2}') }}"

    - name: Validate the VM MAC address
      tags: [guest_config, offline_recovery]
      ansible.builtin.assert:
        that:
          - deployment_mac is string
          - deployment_mac | length == 17

    - name: Wait for a DHCP lease matching the VM MAC address
      tags: [guest_config, offline_recovery]
      ansible.builtin.command:
        argv: [virsh, net-dhcp-leases, "{{ provisioning.vm_network }}", --mac, "{{ deployment_mac }}"]
      register: vm_lease
      changed_when: false
      until: vm_lease.stdout is search('(?:[0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]+')
      retries: 60
      delay: 5

    - name: Extract the IPv4 address
      tags: [guest_config, offline_recovery]
      ansible.builtin.set_fact:
        deployment_ip: "{{ vm_lease.stdout | regex_search('(?:[0-9]{1,3}\\.){3}[0-9]{1,3}(?=/)') }}"

    - name: Add the new guest for connection verification
      tags: [guest_config, offline_recovery]
      ansible.builtin.add_host:
        name: "{{ deployment_name }}"
        groups: provisioned_linux_guest
        ansible_host: "{{ deployment_ip }}"
        ansible_user: "{{ provisioning.guest_ssh_user }}"
        ansible_password: "{{ provisioning.guest_ssh_password }}"
        ansible_become: true
        ansible_become_password: "{{ provisioning.guest_become_password }}"
        deployment_vm_name: "{{ deployment_name }}"
        deployment_vm_ip: "{{ deployment_ip }}"
        deployment_vm_disk_gb: "{{ vm_disk_gb | int }}"
        deployment_vm_vcpus: "{{ vm_vcpus | int }}"
        deployment_vm_memory_mb: "{{ vm_memory_mb | int }}"

- name: Verify the provisioned Linux guest
  hosts: provisioned_linux_guest
  gather_facts: false
  become: true
  no_log: true
  tags: [guest_config, offline_recovery]
  vars_files:
    - ../vars/environment.vault.yml
  tasks:
    - name: Wait for authenticated Ansible access
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Gather guest facts
      ansible.builtin.setup:
        gather_subset: [min, hardware]

    - name: Verify Linux, hostname, and requested resources
      ansible.builtin.assert:
        that:
          - ansible_facts.system == 'Linux'
          - ansible_facts.hostname == deployment_vm_name
          - ansible_facts.processor_vcpus | int == deployment_vm_vcpus | int
          - ansible_facts.memtotal_mb | int >= (deployment_vm_memory_mb | int * 0.9)

    - name: Inspect the guest root filesystem
      ansible.builtin.command:
        argv: [findmnt, -n, -o, SOURCE,FSTYPE, /]
      register: guest_root_filesystem
      changed_when: false

    - name: Check that AAP installer artifacts were removed
      ansible.builtin.find:
        paths: /opt/sources
        patterns: 'ansible-automation-platform-*'
        file_type: any
        recurse: false
      register: remaining_installers

    - name: Check that the AAP service account was removed
      ansible.builtin.command:
        argv: [getent, passwd, "{{ provisioning.aap_service_user }}"]
      register: remaining_aap_account
      changed_when: false
      failed_when: remaining_aap_account.rc not in [0, 2]

    - name: Verify clone cleanup
      ansible.builtin.assert:
        that:
          - remaining_installers.matched == 0
          - remaining_aap_account.rc == 2

    - name: Inspect RHEL subscription registration
      ansible.builtin.command:
        argv: [subscription-manager, identity]
      register: subscription_identity
      changed_when: false
      failed_when: subscription_identity.rc not in [0, 1]

    - name: Register the guest with the existing RHEL activation key when needed
      ansible.builtin.command:
        argv:
          - subscription-manager
          - register
          - --org
          - "{{ provisioning.rhsm_org }}"
          - --activationkey
          - "{{ provisioning.rhsm_activation_key }}"
      when: subscription_identity.rc != 0
      changed_when: true

    - name: Enable RHEL BaseOS and AppStream repositories
      ansible.builtin.command:
        argv:
          - subscription-manager
          - repos
          - --enable=rhel-9-for-x86_64-baseos-rpms
          - --enable=rhel-9-for-x86_64-appstream-rpms
      register: enabled_repositories
      changed_when: false

    - name: Fully update installed packages with DNF
      ansible.builtin.dnf:
        name: '*'
        state: latest
        update_only: true
        update_cache: true
      register: system_update

    - name: Reboot to activate updated system packages
      ansible.builtin.reboot:
        reboot_timeout: 600
        post_reboot_delay: 10
      when: system_update.changed

    - name: Refresh guest facts after updates
      ansible.builtin.setup:
        gather_subset: [min, hardware]

    - name: Verify that no DNF updates remain
      ansible.builtin.command:
        argv: [dnf, --refresh, check-update]
      register: remaining_updates
      changed_when: false
      failed_when: remaining_updates.rc != 0

    - name: Publish verified VM details to the controller
      ansible.builtin.set_stats:
        data:
          linux_vm_name: "{{ deployment_vm_name }}"
          linux_vm_ip: "{{ deployment_vm_ip }}"
          linux_vm_distribution: "{{ ansible_facts.distribution }}"
          linux_vm_vcpus: "{{ ansible_facts.processor_vcpus }}"
          linux_vm_memory_mb: "{{ ansible_facts.memtotal_mb }}"
          linux_vm_disk_gb: "{{ deployment_vm_disk_gb }}"
          linux_vm_root_filesystem: "{{ guest_root_filesystem.stdout }}"
          linux_vm_kernel: "{{ ansible_facts.kernel }}"
          linux_vm_dnf_updated: true
        per_host: false
