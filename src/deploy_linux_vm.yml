---
- name: Deploy one Linux VM from a golden image
  hosts: hypervisor
  become: true
  gather_facts: false
  no_log: true
  tags: [provision]
  vars_files:
    - ../vars/environment_vault.yml
  roles:
    - linux_vm

- name: Verify the provisioned Linux guest
  hosts: provisioned_linux_guest
  gather_facts: false
  become: true
  no_log: true
  tags: [guest_config, offline_recovery]
  vars_files:
    - ../vars/environment_vault.yml
  roles:
    - linux_guest
    - linux_root_growth
    - linux_updates
